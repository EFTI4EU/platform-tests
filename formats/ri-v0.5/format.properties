# Format descriptor: eDelivery message schemas v0.5 of the eFTI reference implementation.
#
# Everything the language-specific code needs to know about this message format is declared here or in the
# files referenced below, so that a new format version only needs a new sibling folder.
# - Paths are relative to this folder.
# - XPath expressions are XPath 3.1. The prefixes declared under "namespace." are available in all of them.
# - Message field expressions are evaluated on the message document and yield the string values of the selected
#   items (several for subsetIds); the fields dataset and identifiers yield the serialized XML of the element.
# - Message templates live in templates/<name>.xml. The template names and placeholder names are format-neutral
#   and must be the same in every format version; the placeholder syntax is
#     {{name}}                   text value, XML-escaped
#     {{{name}}}                 raw XML fragment (e.g. a data set), inserted as is without its XML declaration
#     {{#name}}..{{.}}..{{/name}}  block repeated for each whitespace-separated value of name (e.g. subset IDs)
#   gate side:     data-request (requestId, gateId, platformId, datasetId, subsetIds),
#                  follow-up (requestId, referencedRequestId, gateId, platformId, datasetId, message),
#                  upload-status-success (requestId), upload-status-error (requestId, status, description)
#   platform side: identifier-upload (requestId, datasetId, identifiers), data-response-success (requestId, dataset),
#                  data-response-error (requestId, status, description), follow-up-ack-success (requestId),
#                  follow-up-ack-error (requestId, status, description)
#   fault injection (same placeholders as the base template):
#                  data-request-invalid, follow-up-invalid (schema-invalid, all references present),
#                  data-request-missing-request-id, follow-up-missing-request-id (every value the response may echo
#                  as request ID missing, see followUpAck.echoes),
#                  data-request-unknown-subset (schema-valid, the given subset IDs plus one that denotes no data subset)
# - platform/consignee-signature.xsl is only used by the pseudo platform (module pseudo-platform): the XSLT it applies
#   to the data set at the consignee signature, with parameter signatureTime (xs:dateTime).

format.version=ri-v0.5

namespace.ed=http://efti.eu/v1/edelivery
namespace.common=http://efti.eu/v1/consignment/common
namespace.id=http://efti.eu/v1/consignment/identifier

# Entry point covering all message kinds (gate.xsd includes platform.xsd, which includes edelivery.xsd)
validation.xsd=xsd/edelivery/gate.xsd
# Context-free business rules; each assertion names its test case in @role
validation.schematron=schematron/messages.sch

# Root element (prefix:localName) per format-neutral message kind
kind.IDENTIFIER_UPLOAD=ed:saveIdentifiersRequest
kind.UPLOAD_STATUS=ed:saveIdentifiersResponse
kind.DATA_REQUEST=ed:uilQuery
kind.DATA_RESPONSE=ed:uilResponse
kind.FOLLOW_UP=ed:postFollowUpRequest
kind.FOLLOW_UP_ACK=ed:postFollowUpResponse

# Status codes by meaning. status.success lists the codes accepted as success (whitespace-separated) and is also
# passed to the Schematron as $successStatus; the success templates carry one of them. The other codes are sent in
# error responses: invalidRequest for a request that is rejected as invalid (also a rejected identifier upload),
# notFound for a request for an unknown data set.
status.success=200
status.invalidRequest=400
status.notFound=404

# Which fields of a follow-up its acknowledgement may echo as request ID (whitespace-separated, requestId and/or
# referencedRequestId); the first is the one the platform side echoes. The test report (FTI030, eFTI1794) requires
# the ID of the referenced data request (T-RUN-05); the reference gate of this format expects the follow-up's own
# request ID, which is therefore accepted for the correlation as well (T-ALL-03).
followUpAck.echoes=referencedRequestId requestId

# Maximum length of the text of a follow-up (characters) that a platform must accept. The XSD sets no limit; 512 is
# the limit of the technical guidance (FTI025, follow-up text eFTI2018: an..512).
followUp.maxTextLength=512

# What a test case cannot evaluate in this format (limitation.<test case ID>). The test report states it as a note on
# every result of the test case, so that a PASSED does not claim more than was checked.
limitation.T-DAT-01=field lengths and code lists are only checked as far as the schema of message format ri-v0.5 \
  enforces them
limitation.T-DAT-02=gate and platform identifier, data set ID in responses, and message timestamp are not checked: \
  message format ri-v0.5 does not carry them
limitation.T-DAT-03=of the fields the registry of identifiers requires according to the technical guidance, only the \
  mode of transport and the dangerous goods indicator are checked
limitation.T-ALL-03=message format ri-v0.5 has no message instance ID (eFTI1); the AS4 message IDs and the request IDs \
  of identifier uploads must be unique instead
limitation.T-NEG-04=whether a success response carries the injected identifier is not checked: responses of message \
  format ri-v0.5 do not carry the gate and platform identifier
limitation.T-NEG-08=whether a success acknowledgement carries the injected identifier is not checked: acknowledgements \
  of message format ri-v0.5 do not carry the gate and platform identifier

# Message fields
field.requestId=/*/@requestId
field.referencedRequestId=/ed:postFollowUpRequest/@uilQueryRequestId
field.gateId=/*/ed:uil/ed:gateId
field.platformId=/*/ed:uil/ed:platformId
field.datasetId=/*/ed:uil/ed:datasetId | /ed:saveIdentifiersRequest/@datasetId
field.status=/*/@status
field.description=/*/ed:description
field.message=/ed:postFollowUpRequest/ed:message
field.subsetIds=/ed:uilQuery/ed:subsetId
field.dataset=/ed:uilResponse/common:consignment
field.identifiers=/ed:saveIdentifiersRequest/id:consignment

# Data set (common data set) and identifier consignment: XSD and name of the global root element.
# The subset annotations of the data set XSD drive subset filtering and the composition checks; the structure of the
# identifier XSD drives the derivation of identifier uploads.
dataset.xsd=xsd/consignment-common.xsd
dataset.element=consignment
identifiers.xsd=xsd/consignment-identifier.xsd
identifiers.element=consignment

# Subset annotations in the xsd:appinfo of an element declaration, here
#   <efti id="eFTI39" parentId="ASBIE1027"><subset id="EU01" status="M"/>..</efti>
# The annotation element (in no namespace) names the data element (id) and its parent (parentId); an element of a
# type shared between contexts carries one annotation per context, and the one whose parentId is the id of the
# parent's annotation applies. Each subset child names a subset the element belongs to and its status there.
annotation.element=efti
annotation.id=id
annotation.parentId=parentId
annotation.subset=subset
annotation.subsetId=id
annotation.status=status

# Meaning of the subset status codes (whitespace-separated). Every code the XSDs use must be listed, otherwise the
# format fails to load.
#   MANDATORY    present (and non-empty in a test run) if the parent is present (T-DAT-04); compared in the round trip
#   OPTIONAL     may be omitted, also in the round trip (T-DAT-06, which only lists omitted ones in the report)
#   CONDITIONAL  the condition is not evaluated: neither required (T-DAT-04) nor omittable in the round trip
#   STRUCTURAL   aggregate; required if it holds mandatory elements and is not repeatable (T-DAT-04)
# Interpretation of the irregular codes of this XSD:
# - Composite codes (statuses joined with '/', e.g. C/M, O/C/C) list several statuses of the data element in the
#   subset; which one applies depends on the context, so they count as conditional.
# - c is a lowercase C; M/1 (only DE01) and MS (only AT01) are unexplained and count as conditional, so they are
#   not enforced.
subsetStatus.MANDATORY=M
subsetStatus.OPTIONAL=O
subsetStatus.CONDITIONAL=C c M/1 MS \
  C/C C/C/C C/C/C/C C/C/C/C/C C/C/C/C/C/C C/C/C/C/C/C/C C/C/C/C/C/C/C/C C/C/C/C/C/C/C/C/C/C \
  C/C/C/C/C/C/C/O C/C/C/O C/C/O C/C/O/C C/M C/O C/O/C C/O/O/C/C/C/C/C/C/O/C/C/C/C/C/C M/C \
  O/C O/C/C O/C/C/O O/O/C/C/C/C/C/C/O/C/C/C/C/C/C
subsetStatus.STRUCTURAL=SI

# Identifier values, evaluated relative to a consignment element. They apply to both the identifier consignment
# of an upload and the data set of a response, which use different namespaces, hence the *: name tests.
# Values that belong together (e.g. an ID and its registration country) form one value whose fields are joined with
# '|', always with all fields (an absent one as empty string): T-DAT-05 compares such values field by field and skips
# fields a data response does not carry. Comparison is by value: a date with offset (format 205) is read as its instant in
# UTC and a sequence number as an integer; a value that cannot be read so stays as it is.
identifier.TRANSPORT_MEANS=*:mainCarriageTransportMovement/*:usedTransportMeans/string-join((string(*:id), string(*:registrationCountry/*:code)), '|')
identifier.TRANSPORT_EQUIPMENT=*:usedTransportEquipment/string-join((string(*:id), string(*:registrationCountry/*:code), string(*:categoryCode), string(*:sequenceNumber/(if (. castable as xs:integer) then xs:integer(.) else .))), '|')
identifier.CARRIED_EQUIPMENT=*:usedTransportEquipment/*:carriedTransportEquipment/string-join((string(*:id), string(*:sequenceNumber/(if (. castable as xs:integer) then xs:integer(.) else .))), '|')
identifier.CARRIER_ACCEPTANCE_DATE=*:carrierAcceptanceDateTime/(let $iso := replace(normalize-space(.), '^([0-9]{4})([0-9]{2})([0-9]{2})([0-9]{2})([0-9]{2})([+-][0-9]{2})([0-9]{2})$', '$1-$2-$3T$4:$5:00$6:$7') return \
  string-join((if (@formatId = '205' and $iso castable as xs:dateTime) then string(adjust-dateTime-to-timezone(xs:dateTime($iso), xs:dayTimeDuration('PT0S'))) else string(.), string(@formatId)), '|'))
identifier.ACTUAL_DELIVERY_DATE=*:deliveryEvent/*:actualOccurrenceDateTime/(let $iso := replace(normalize-space(.), '^([0-9]{4})([0-9]{2})([0-9]{2})([0-9]{2})([0-9]{2})([+-][0-9]{2})([0-9]{2})$', '$1-$2-$3T$4:$5:00$6:$7') return \
  string-join((if (@formatId = '205' and $iso castable as xs:dateTime) then string(adjust-dateTime-to-timezone(xs:dateTime($iso), xs:dayTimeDuration('PT0S'))) else string(.), string(@formatId)), '|'))
identifier.MODE_OF_TRANSPORT=*:mainCarriageTransportMovement/*:modeCode/string(.)
identifier.DANGEROUS_GOODS=*:mainCarriageTransportMovement/*:dangerousGoodsIndicator/string(xs:boolean(normalize-space(.)))

# Value of the identifier MODE_OF_TRANSPORT that means road (T-RUN-06 checks retrievability after delivery only there)
modeOfTransport.road=3

# Round-trip comparison (T-DAT-06): data set elements (paths of local names below the root, comma-separated)
# whose content the platform sets itself (signatures, combined transport stamp, carrier acceptance date, delivery)
# and which are therefore not compared
roundtrip.ignore=carrier/confirmedDocumentAuthentication, consignee/confirmedDocumentAuthentication, \
  consignor/confirmedDocumentAuthentication, \
  mainCarriageTransportMovement/unloadingEvent/certifyingParty/confirmedDocumentAuthentication, \
  carrierAcceptanceDateTime, deliveryEvent
