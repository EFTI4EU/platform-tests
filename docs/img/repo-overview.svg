<g class="c-grey"><rect x="20" y="0" width="860" height="40" rx="6"/><text x="450" y="25.5" text-anchor="middle" class="t-head">Requirements for eFTI platforms</text></g>
<path class="link" d="M227 40 L227 62" marker-end="url(#arrow)"/><path class="link" d="M673 40 L673 62" marker-end="url(#arrow)"/>
<g class="c-red"><rect x="20" y="66" width="414" height="116" rx="6"/><text x="34" y="90" class="t-head">Important for authorities:</text><text x="34" y="108" class="t-head">does the right data arrive?</text><text x="34" y="130">• secure connection between platform and Gate</text><text x="34" y="147">• search, data retrieval, and follow-up communication</text><text x="34" y="164">• data format &amp; content correct</text></g>
<g class="c-yellow"><rect x="466" y="66" width="414" height="116" rx="6"/><text x="480" y="90" class="t-head">Protects EOs and data subjects,</text><text x="480" y="108" class="t-head">largely enforced elsewhere</text><text x="480" y="130">• user management, audit trail (CRA, NIS2, civil liability)</text><text x="480" y="147">• storage, deletion periods (GDPR); signatures (eIDAS)</text><text x="480" y="164">• user interface, notifications (civil liability)</text></g>

