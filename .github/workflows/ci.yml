name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

  # The local test setup as in GETTING_STARTED.md, with run-all.py playing the operator on the pseudo-platform
  end-to-end:
    runs-on: ubuntu-latest
    # A step nobody confirms only fails after 15 minutes per data set
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # code.europa.eu is slow and at times unreachable. With the official image in the local image store, the build
      # of deploy/domibus does not contact that registry.
      - name: Read the official Domibus image from the Dockerfile
        id: domibus
        run: echo "image=$(sed -n 's/^ARG DOMIBUS_IMAGE=//p' deploy/domibus/Dockerfile)" >> "$GITHUB_OUTPUT"
      - name: Restore the official Domibus image
        id: domibus-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/domibus-official.tar
          key: domibus-official-${{ steps.domibus.outputs.image }}
      - name: Load the official Domibus image
        if: steps.domibus-cache.outputs.cache-hit == 'true'
        run: docker load --input "$RUNNER_TEMP/domibus-official.tar"
      - name: Pull the official Domibus image
        if: steps.domibus-cache.outputs.cache-hit != 'true'
        env:
          IMAGE: ${{ steps.domibus.outputs.image }}
        run: |
          for attempt in 1 2 3; do
            docker pull --platform linux/amd64 "$IMAGE" && break || sleep 30
          done
          docker save --output "$RUNNER_TEMP/domibus-official.tar" "$IMAGE"
      # Saved right after the pull instead of at the end of the job, so that a failing test run keeps the image
      - name: Save the official Domibus image
        if: steps.domibus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/domibus-official.tar
          key: ${{ steps.domibus-cache.outputs.cache-primary-key }}

      - name: Start the test setup
        run: sh deploy/tst.sh start
      - name: Run all data sets against the pseudo-platform
        run: python3 deploy/run-all.py
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: deploy/reports/pseudoplatform/
      - name: Show the container logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 200
