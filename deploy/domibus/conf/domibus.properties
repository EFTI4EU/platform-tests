# Only deviations from the Domibus defaults (domibus-default.properties inside the WAR).

# Setting the general schema enables multi-tenancy; every directory under domains/ is a domain.
domibus.database.general.schema=general_schema
domibus.datasource.driverClassName=com.mysql.cj.jdbc.Driver
domibus.datasource.url=jdbc:mysql://mysql:3306/general_schema?useSSL=false&allowPublicKeyRetrieval=true&useLegacyDatetimeCode=false&serverTimezone=UTC
domibus.datasource.user=edelivery
domibus.datasource.password=edelivery
domibus.entityManagerFactory.jpaProperty.hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver
domibus.entityManagerFactory.jpaProperty.hibernate.dialect=org.hibernate.dialect.MySQLDialect
domibus.entityManagerFactory.jpaProperty.hibernate.id.new_generator_mappings=false

# Single node with the embedded ActiveMQ broker, so no external broker is needed.
activeMQ.embedded.configurationFile=file:///${domibus.config.location}/internal/activemq.xml

# Test-only admin console login super/123456 without forced password change.
domibus.passwordPolicy.defaultUser.autogeneratePassword=false
domibus.passwordPolicy.checkDefaultPassword=false
domibus.passwordPolicy.expiration=0
domibus.plugin.passwordPolicy.expiration=0
domibus.plugin.passwordPolicy.defaultPasswordExpiration=0
