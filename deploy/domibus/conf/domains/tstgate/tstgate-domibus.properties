# Keystore/truststore are generated by deploy/certs/generate-certs.sh (test-only passwords).
tstgate.domibus.database.schema=tstgate
tstgate.domibus.security.keystore.location=${domibus.config.location}/domains/tstgate/keystore.p12
tstgate.domibus.security.keystore.type=PKCS12
tstgate.domibus.security.keystore.password=test123
tstgate.domibus.security.key.private.alias=tstgate
tstgate.domibus.security.key.private.password=test123
tstgate.domibus.security.truststore.location=${domibus.config.location}/domains/tstgate/truststore.p12
tstgate.domibus.security.truststore.type=PKCS12
tstgate.domibus.security.truststore.password=test123
