# Keystore/truststore are generated by deploy/certs/generate-certs.sh (test-only passwords).
pseudoplatform.domibus.database.schema=pseudoplatform
pseudoplatform.domibus.security.keystore.location=${domibus.config.location}/domains/pseudoplatform/keystore.p12
pseudoplatform.domibus.security.keystore.type=PKCS12
pseudoplatform.domibus.security.keystore.password=test123
pseudoplatform.domibus.security.key.private.alias=pseudoplatform
pseudoplatform.domibus.security.key.private.password=test123
pseudoplatform.domibus.security.truststore.location=${domibus.config.location}/domains/pseudoplatform/truststore.p12
pseudoplatform.domibus.security.truststore.type=PKCS12
pseudoplatform.domibus.security.truststore.password=test123
