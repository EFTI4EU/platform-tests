# Format descriptor of a minimal synthetic format for the tests of the checks, independent of any real format.
# The keys are documented in formats/ri-v0.5/format.properties.

format.version=mini

namespace.m=urn:tst:mini:messages
namespace.d=urn:tst:mini:dataset
namespace.i=urn:tst:mini:identifiers

validation.xsd=xsd/messages.xsd
validation.schematron=schematron/messages.sch

kind.IDENTIFIER_UPLOAD=m:upload
kind.UPLOAD_STATUS=m:uploadStatus
kind.DATA_REQUEST=m:dataRequest
kind.DATA_RESPONSE=m:dataResponse
kind.FOLLOW_UP=m:followUp
kind.FOLLOW_UP_ACK=m:followUpAck

status.success=200
status.invalidRequest=400
status.notFound=404

followUpAck.echoes=requestId referencedRequestId
followUp.maxTextLength=100

field.requestId=/*/@requestId
field.referencedRequestId=/m:followUp/@dataRequestId
field.gateId=/*/m:uil/m:gate
field.platformId=/*/m:uil/m:platform
field.datasetId=/*/m:uil/m:dataset | /m:upload/@datasetId
field.status=/*/@status
field.description=/*/m:description
field.message=/m:followUp/m:text
field.subsetIds=/m:dataRequest/m:subset
field.dataset=/m:dataResponse/d:shipment
field.identifiers=/m:upload/i:shipment

dataset.xsd=xsd/dataset.xsd
dataset.element=shipment
identifiers.xsd=xsd/identifiers.xsd
identifiers.element=shipment

annotation.element=efti
annotation.id=id
annotation.parentId=parentId
annotation.subset=subset
annotation.subsetId=id
annotation.status=status

subsetStatus.MANDATORY=M
subsetStatus.OPTIONAL=O
subsetStatus.CONDITIONAL=C C/M
subsetStatus.STRUCTURAL=SI

identifier.TRANSPORT_MEANS=*:vehicle/string-join((string(*:plate), string(*:country)), '|')
identifier.TRANSPORT_EQUIPMENT=*:equipment/string-join((string(*:id), string(*:country), string(*:category), string(*:seq)), '|')
identifier.CARRIED_EQUIPMENT=*:equipment/*:carried/string-join((string(*:id), string(*:seq)), '|')
identifier.CARRIER_ACCEPTANCE_DATE=*:acceptedAt/string(.)
identifier.ACTUAL_DELIVERY_DATE=*:delivery/*:at/string(.)
identifier.MODE_OF_TRANSPORT=*:mode/string(.)
identifier.DANGEROUS_GOODS=*:dangerous/string(xs:boolean(normalize-space(.)))

modeOfTransport.road=3

roundtrip.ignore=acceptedAt, delivery, receiver/signature

